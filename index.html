    o.innerHTML='<div class="scrim" data-close="1" style="background:transparent;backdrop-filter:none"><div class="notif" onclick="event.stopPropagation()">'+
     '<header><b style="font-family:var(--disp)">Alerts</b><span class="pill p-mute">'+n.length+'</span><span class="spacer" style="flex:1"></span><button class="chip-btn sm" data-act="markRead">Mark all read</button><button class="x" data-close="1">×</button></header>'+
     (n.length?n.map(x=>'<button class="n" data-open="'+esc(x.tid)+'"><span class="pill '+(x.kind==='crit'?'p-crit':x.kind==='wait'?'p-wait':x.kind==='warn'?'p-warn':x.kind==='ok'?'p-ok':'p-info')+'" style="align-self:flex-start">●</span><span><b>'+esc(x.title)+'</b><span>'+esc(x.body)+'</span></span></button>').join(''):'<div class="empty">Nothing needs your attention.</div>')+
    '</div></div>';
  } else o.innerHTML='';
}
function askConfirm(msg,okLabel,danger){
  return new Promise(res=>{
    const dlg=$('#dialog');
    dlg.innerHTML='<div class="scrim" style="z-index:200;align-items:center"><div class="modal" style="max-width:450px" role="dialog" aria-label="Confirm">'+
      '<header><h3>Please confirm</h3></header><div class="mbody"><p style="margin:0;font-size:13.5px">'+esc(msg)+'</p></div>'+
      '<footer><button class="btn ghost" id="cfNo">Cancel</button><button class="btn '+(danger===false?'accent':'danger')+'" id="cfYes">'+esc(okLabel||'Confirm')+'</button></footer></div></div>';
    const done=v=>{ dlg.innerHTML=''; res(v); };
    $('#cfYes').addEventListener('click',()=>done(true));
    $('#cfNo').addEventListener('click',()=>done(false));
    $('#cfYes').focus();
  });
}
function go(v){ state.view=v; state.page=1; render(); }
function setFilters(f){ state.filters=f; state.page=1; }
function openKpi(group){
  const m={all:{},open:{group:'open'},wip:{status:'Work in Progress'},our:{group:'open',waiting:'Our Side'},
    plat:{group:'open',waiting:'Platform Side'},fuToday:{group:'fuDue'},overdue:{group:'overdue'},resolved:{status:'Resolved'},
    action:{group:'action'},noupdate:{group:'noupdate'},onTrack:{group:'open',sla:'On Track'},dueToday:{group:'open',sla:'Due Today'},dueSoon:{group:'open',sla:'Due Soon'}};
  setFilters(Object.assign({},m[group]||{}));
  go('tickets');
}

/* ============ import ============ */
function setImport(headers,rows){
  importRows={headers,rows}; importMap=guessMap(headers); render();
}
function parseSheetFile(file){
  const reader=new FileReader();
  const isCsv=/\.(csv|tsv|txt)$/i.test(file.name);
  reader.onload=e=>{
    try{
      if(isCsv && typeof XLSX==='undefined'){ parseDelimited(String(e.target.result)); return; }
      const wb=XLSX.read(e.target.result,{type:isCsv?'string':'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
      if(!rows.length){ toast('That sheet has no data rows.'); return; }
      setImport(Object.keys(rows[0]),rows);
    }catch(err){ toast('Could not read that file. Try CSV, or paste the rows instead.'); }
  };
  if(isCsv) reader.readAsText(file); else reader.readAsArrayBuffer(file);
}
function parseDelimited(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(lines.length<2){ toast('Paste the header row plus at least one data row.'); return; }
  const delim=lines[0].includes('\t')?'\t':',';
  const headers=lines[0].split(delim).map(h=>h.trim());
  const rows=lines.slice(1).map(l=>{ const c=l.split(delim); const o={}; headers.forEach((h,i)=>o[h]=(c[i]||'').trim()); return o; });
  setImport(headers,rows);
}
async function runImport(){
  if(!importRows) return;
  const mode=($('#impMode')||{}).value||'skip';
  const defPriority=($('#impPriority')||{}).value||'Medium';
  const defRaised=($('#impRaised')||{}).value||'';
  const defAssign=($('#impAssign')||{}).value||'';
  const inv={}; Object.keys(importMap).forEach(h=>{ if(importMap[h]) inv[importMap[h]]=h; });
  const out=[]; let skipped=0, updated=0;
  importRows.rows.forEach(r=>{
    const get=f=> inv[f]!=null ? String(r[inv[f]]==null?'':r[inv[f]]).trim() : '';
    const ticketId=get('ticketId');
    const desc=get('description');
    if(!ticketId && !desc) return;
    const existing=state.tickets.find(x=>x.ticketId && ticketId && String(x.ticketId).toLowerCase()===ticketId.toLowerCase());
    if(existing && mode==='skip'){ skipped++; return; }
    const created=parseDate(get('createdDate'));
    const end=parseDate(get('endDate'));
    const st=normStatus(get('statusText'));
    let status = end ? 'Resolved' : (st.status||'Open');
    const t={
      id: existing&&mode==='update'?existing.id:uid('i_'),
      source:'import',
      ticketId: ticketId||'',
      platform: normPlatform(get('platform')),
      category: get('category'),
      description: desc,
      createdDate: created?iso(created):'',
      endDate: end?iso(end):'', actualResolutionDate: end?iso(end):'',
      targetDate:'', expectedResolutionDate:'',
      status, priority: get('priority')||defPriority,
      assignedTo: get('assignedTo')||defAssign, raisedBy: get('raisedBy')||defRaised,
      department:'', orderId:get('orderId'), sku:get('sku'),
      remarks: get('remarks'), internalNotes:'', attachments:'', ticketLink:'',
      delayReason:'', delayOwner:'', lastReplyFrom:'', lastReplyDate:'',
      ourLastResponseDate:'', platformLastResponseDate:'', nextFollowupDate:'',
      followups:0, escalations:0,
      lastActionBy:'', lastActionDate: end?iso(end):'',
      activities:[]
    };
    if(created) t.activities.push({id:uid('a_'),date:iso(created),time:'',by:t.raisedBy||'',type:'Ticket Raised',desc:desc||'Imported from Excel',replyFrom:'Our Team',next:'',nextDate:'',attach:''});
    if(st.note) t.activities.push({id:uid('a_'),date:end?iso(end):(created?iso(created):''),time:'',by:t.assignedTo||'',type:end?'Resolution':'Note',desc:'Sheet update: '+st.note,replyFrom:'',next:'',nextDate:'',attach:''});
    if(existing&&mode==='update'){ t.activities=(existing.activities||[]).concat(t.activities); updated++; }
    out.push(t);
  });
  if(!out.length){ toast('Nothing imported'+(skipped?' — '+skipped+' rows already exist.':'.')); return; }
  await putMany(out);
  importRows=null; importMap={};
  toast('Imported '+out.length+' tickets'+(updated?' ('+updated+' updated)':'')+(skipped?', skipped '+skipped+' duplicates':'')+'.');
  setFilters({}); go('tickets');
}

/* ============ activity save ============ */
async function addActivity(id){
  const t=state.tickets.find(x=>x.id===id); if(!t) return;
  const g=k=>{const el=document.getElementById(k);return el?el.value.trim():'';};
  const desc=g('ac_desc');
  if(!desc){ toast('Add a short description of the activity.'); const el=$('#ac_desc'); if(el) el.focus(); return; }
  const a={id:uid('a_'),date:g('ac_date')||iso(today()),time:g('ac_time'),by:g('ac_by'),type:g('ac_type'),
    desc,replyFrom:g('ac_reply'),next:g('ac_next'),nextDate:g('ac_nextDate'),attach:g('ac_attach')};
  t.activities=(t.activities||[]).concat([a]);
  t.lastActionBy=a.by; t.lastActionDate=a.date;
  if(a.nextDate) t.nextFollowupDate=a.nextDate;
  if(a.replyFrom){ t.lastReplyFrom=a.replyFrom; t.lastReplyDate=a.date;
    if(a.replyFrom==='Our Team') t.ourLastResponseDate=a.date; else t.platformLastResponseDate=a.date; }
  if(a.type==='Follow-up') t.followups=(t.followups||0)+1;
  if(a.type==='Escalation') t.escalations=(t.escalations||0)+1;
  const newStatus=g('ac_status')||t.status;
  t.status=newStatus;
  if(newStatus==='Resolved'&&!t.actualResolutionDate){ t.actualResolutionDate=a.date; t.endDate=a.date; }
  if(!DONE.includes(newStatus)){ t.actualResolutionDate=''; t.endDate=''; }
  await putTicket(t);
  toast('Activity added to '+t.ticketId);
  render();
}

/* ============ events ============ */
document.addEventListener('click', async (e)=>{
  const el=e.target.closest('[data-go],[data-kpi],[data-open],[data-act],[data-close],[data-page],[data-sort],[data-rmflt],[data-filter-wait],[data-filter-delay],[data-filter-bucket],[data-rtab],[data-rmteam]');
  if(!el) return;
  const d=el.dataset;
  if(d.close!=null && (e.target===el||el.classList.contains('x')||el.tagName==='BUTTON')){
    if(e.target.closest('.modal')&&!el.classList.contains('x')&&el.tagName!=='BUTTON') return;
    state.detail=null; state.newForm=false; state.notifOpen=false; renderOverlay(); return;
  }
  if(d.go){ state.notifOpen=false; state.detail=null; if(d.go==='tickets') setFilters({}); go(d.go); return; }
  if(d.kpi){ state.notifOpen=false; openKpi(d.kpi); return; }
  if(d.open){ state.notifOpen=false; state.detail={id:d.open,mode:'view'}; renderOverlay(); return; }
  if(d.rtab){ state.reportTab=d.rtab; render(); return; }
  if(d.page){ const p=+d.page; if(p>=1){ state.page=p; render(); } return; }
  if(d.sort){ const k=d.sort; state.sort = state.sort.k===k?{k,dir:state.sort.dir==='asc'?'desc':'asc'}:{k,dir:k==='ticketId'||k==='platform'?'asc':'desc'}; render(); return; }
  if(d.rmflt){ if(d.rmflt==='__search'){ state.search=''; $('#globalSearch').value=''; } else delete state.filters[d.rmflt]; state.page=1; render(); return; }
  if(d.filterWait!=null){ setFilters({group:'open',waiting:d.filterWait}); go('tickets'); return; }
  if(d.filterDelay!=null){ setFilters({group:'open',delayReason:d.filterDelay==='Not recorded yet'?'':d.filterDelay}); go('tickets'); return; }
  if(d.filterBucket!=null){ setFilters({group:'open',bucket:d.filterBucket}); go('tickets'); return; }
  if(d.rmteam){ state.settings.team=state.settings.team.filter(p=>p!==d.rmteam); await saveSettings(); render(); return; }
  const act=d.act;
  if(!act) return;
  switch(act){
    case 'new': state.newForm=true; state.detail=null; renderOverlay(); break;
    case 'editTicket': state.detail={id:d.id,mode:'edit'}; renderOverlay(); break;
    case 'saveTicket': {
      const existing=d.id?state.tickets.find(x=>x.id===d.id):null;
      const t=readTicketForm(existing);
      if(!t){ toast('Fill in the required fields.'); return; }
      if(!existing && state.tickets.some(x=>x.ticketId&&x.ticketId.toLowerCase()===t.ticketId.toLowerCase())){
        if(!await askConfirm('A ticket with ID '+t.ticketId+' already exists. Create it anyway?','Create anyway',false)) return;
      }
      await putTicket(t);
      state.newForm=false; state.detail={id:t.id,mode:'view'};
      toast(existing?'Ticket updated.':'Ticket '+t.ticketId+' created.');
      render(); break;
    }
    case 'delTicket': {
      const t=state.tickets.find(x=>x.id===d.id);
      if(t && await askConfirm('Delete ticket '+t.ticketId+' and its '+ (t.activities||[]).length +' activity entries? This cannot be undone.','Delete ticket')){
        await delTicket(d.id); state.detail=null; toast('Ticket deleted.'); render();
      } break;
    }
    case 'addActivity': await addActivity(d.id); break;
    case 'clearFilters': setFilters({}); state.search=''; $('#globalSearch').value=''; render(); break;
    case 'exportCsv': exportCsv(); break;
    case 'exportXlsx': exportXlsx(); break;
    case 'exportActivity': exportActivityCsv(); break;
    case 'template': downloadTemplate(); break;
    case 'backup': backupJson(); break;
    case 'print': window.print(); break;
    case 'markRead': state.readNotifs=buildNotifications().map(x=>x.id); renderNav(); renderOverlay(); break;
    case 'parsePaste': { const v=($('#impPaste')||{}).value||''; if(!v.trim()){ toast('Paste the rows first.'); return; } parseDelimited(v); break; }
    case 'cancelImport': importRows=null; importMap={}; render(); break;
    case 'doImport': await runImport(); break;
    case 'addMember': { const inp=$('#newMember'); const v=(inp.value||'').trim();
      if(v && !state.settings.team.includes(v)){ state.settings.team.push(v); await saveSettings(); render(); } break; }
    case 'sheetConnect': {
      const url=(($('#sh_url')||{}).value||'').trim(), key=(($('#sh_key')||{}).value||'').trim();
      if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){ toast('Paste the Apps Script Web App URL — it starts with https://script.google.com/'); return; }
      el.disabled=true; setSync('sheet','connecting');
      try{
        await sheetCall({action:'ping'},{url,key});
        SHEET={url,key};
        try{ localStorage.setItem(LS_SHEET,JSON.stringify(SHEET)); }catch(_){}
        await sheetRefresh();
        startPolling();
        toast(state.sync.status==='ok'?'Connected — '+plural(state.tickets.length,'shared ticket')+' loaded.':'Connected, but sync failed: '+state.sync.msg);
      }catch(err){
        setSync(SHEET?'sheet':'local',SHEET?'error':'ok',err.message);
        toast(err.message);
      }
      render(); break;
    }
    case 'sheetRetry': await sheetRefresh(); render({background:true}); toast(state.sync.status==='ok'?'Synced.':state.sync.msg); break;
    case 'sheetDisconnect':
      if(await askConfirm('Disconnect this browser from the shared sheet? Tickets stay in the sheet; this browser goes back to keeping its own copy only.','Disconnect',false)){
        SHEET=null; try{ localStorage.removeItem(LS_SHEET); }catch(_){}
        setSync('local','ok'); render();
      } break;
    case 'uploadLocal': await uploadLocalOnly(); break;
    case 'wipe': if(await askConfirm('Delete ALL '+state.tickets.length+' tickets and their activity? This cannot be undone.','Delete everything')){ await wipeAll(); toast('All tickets deleted.'); render(); } break;
  }
});
document.addEventListener('change', async (e)=>{
  const el=e.target;
  if(el.id==='roleSel'){ state.role=el.value; try{localStorage.setItem('ectrl.role',el.value);}catch(_){} render(); return; }
  if(el.id==='impFile'){ const f=el.files&&el.files[0]; if(f) parseSheetFile(f); return; }
  if(el.id==='restoreFile'){ const f=el.files&&el.files[0]; if(f) await mergeBackup(f); return; }
  if(el.dataset.flt!=null){ const k=el.dataset.flt; const v=el.value; if(v) state.filters[k]=v; else delete state.filters[k]; state.page=1; render(); return; }
  if(el.dataset.map!=null){ importMap[el.dataset.map]=el.value; return; }
  if(el.dataset.act==='perPage'){ state.perPage=+el.value; state.page=1; render(); return; }
  if(el.dataset.sla!=null){ state.settings.sla[el.dataset.sla]=Math.max(1,+el.value||1); await saveSettings(); render(); return; }
  if(el.dataset.alert!=null){ state.settings.alerts[el.dataset.alert]=Math.max(1,+el.value||1); await saveSettings(); render(); return; }
  if(el.dataset.setting==='dueSoon'){ state.settings.dueSoon=Math.max(1,+el.value||1); await saveSettings(); render(); return; }
  if(el.dataset.setting==='notifyEmail'){ state.settings.notify.email=el.value; await saveSettings(); return; }
  if(el.dataset.notify!=null){ state.settings.notify[el.dataset.notify]=el.checked; await saveSettings(); renderNav(); return; }
});
let searchTimer;
document.addEventListener('input',e=>{
  if(e.target.id!=='globalSearch') return;
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    state.search=e.target.value.trim(); state.page=1;
    if(state.search && !['tickets','activity'].includes(state.view)) go('tickets'); else render();
    const s=$('#globalSearch'); if(s){ s.value=state.search; s.focus(); }
  },260);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&(state.detail||state.newForm||state.notifOpen)){ state.detail=null;state.newForm=false;state.notifOpen=false;renderOverlay(); }
  if(e.key==='/'&&!/input|textarea|select/i.test(e.target.tagName)){ e.preventDefault(); $('#globalSearch').focus(); }
});
$('#newBtn').addEventListener('click',()=>{ if(!can('create')){ toast(state.canWrite?'Your role cannot raise tickets.':'You have view-only access — ask the owner for “Can interact” or “Can edit”.'); return; } state.newForm=true; state.detail=null; renderOverlay(); });
$('#bellBtn').addEventListener('click',()=>{ state.notifOpen=!state.notifOpen; state.detail=null; state.newForm=false; renderOverlay(); });
$('#themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':cur==='light'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark');
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('ectrl.theme',next);}catch(_){}
});

/* ============ boot ============ */
(function initTheme(){ try{ const t=localStorage.getItem('ectrl.theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(_){} })();
(function initRole(){ try{ const r=localStorage.getItem('ectrl.role'); if(r&&ROLES.includes(r)) state.role=r; }catch(_){} })();

let pollTimer=null;
function startPolling(){
  if(pollTimer) return;
  pollTimer=setInterval(async()=>{ if(SHEET && document.visibilityState==='visible'){ await sheetRefresh(); render({background:true}); } },60000);
}
document.addEventListener('visibilitychange',async()=>{ if(SHEET && document.visibilityState==='visible'){ await sheetRefresh(); render({background:true}); } });

const inClaude=!!(window.claude&&window.claude.use);
loadLocal();
SHEET=inClaude?null:sheetCfg();
setSync(inClaude?'artifact':SHEET?'sheet':'local', (inClaude||SHEET)?'connecting':'ok');
render();

(async function boot(){
  if(!inClaude){
    if(SHEET){ await sheetRefresh();
      /* the sheet decides whether a key is needed; only nudge for one if it actually asked */
      if(!SHEET.key && state.sync.status==='error' && /team key/i.test(state.sync.msg)) setSync('sheet','error','Team key missing — open Settings → Shared data, type the team key and click Connect & sync.');
      else startPolling();
      render({background:true}); }
    return;
  }
  const c=window.claude;
  let db=null,user=null,dl=null;
  try{ [db,user,dl]=await Promise.all([c.use('db'),c.use('user'),c.use('downloads')]); }catch(_){}
  DBX=db; USERX=user; DLX=dl;
  if(user){
    try{ const w=await user.can('data.write'); if(w===false){ state.canWrite=false; } }catch(_){}
    try{ if(await user.isOwner()===false && await user.canEdit()===false && state.role==='Admin') state.role='Team Member'; }catch(_){}
  }
  if(!db){ setSync('local','ok'); render({background:true}); return; }
  if(!state.canWrite) setSync('artifact','readonly','Your access to this dashboard is view-only, so you can read tickets but not raise or update them.');
  try{
    const s=await db.doc('config/settings').get();
    if(s.exists && s.data() && s.data().v) state.settings=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),s.data().v);
  }catch(_){}
  const un=db.collection('tickets').onSnapshot(snap=>{
    state.tickets=snap.docs.map(x=>Object.assign({id:x.id},x.data()));
    if(state.sync.status==='connecting') setSync('artifact','ok');
    render({background:true});
  },err=>{ DBX=null; setSync('artifact','error','Lost the connection to the shared store'+(err&&err.code?' ('+err.code+')':'')+'. Reload the page.'); render({background:true}); });
  unsubs.push(un);
})();
