<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Marketplace Ticket Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --surface-2:#F6F9FB; --surface-3:#EDF2F6;
  --line:#DEE6EC; --line-2:#C7D3DC;
  --ink:#13212F; --ink-2:#465b70; --ink-3:#71879b;
  --brand:#152744; --brand-2:#223a61; --brand-ink:#F2F6FA;
  --accent:#0C7A85; --accent-2:#0a626b; --accent-soft:#DFF0F1;
  --ok:#14724A; --ok-bg:#E2F1E9; --ok-line:#B7DCC8;
  --warn:#96650A; --warn-bg:#FAF0D9; --warn-line:#EAD5A2;
  --wait:#A94A0C; --wait-bg:#FBEBE0; --wait-line:#F0CDB4;
  --crit:#A81F18; --crit-bg:#FAE6E4; --crit-line:#EFC2BE;
  --info:#1F4C93; --info-bg:#E3EBF7; --info-line:#C1D2ED;
  --mute:#5E7185; --mute-bg:#E9EEF2; --mute-line:#D2DCE4;
  --shadow-1:0 1px 2px rgba(15,32,48,.06);
  --shadow-2:0 1px 2px rgba(15,32,48,.05), 0 8px 20px -12px rgba(15,32,48,.28);
  --radius:14px; --radius-sm:9px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --disp:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B121A; --surface:#121C26; --surface-2:#17232F; --surface-3:#1D2B39;
  --line:#243444; --line-2:#334557;
  --ink:#E6EEF6; --ink-2:#A6B8C8; --ink-3:#7A8E9F;
  --brand:#1A2D4C; --brand-2:#27405F; --brand-ink:#EAF1F8;
  --accent:#3BB5C0; --accent-2:#5fcdd6; --accent-soft:#12333a;
  --ok:#5CC08D; --ok-bg:#122E22; --ok-line:#1F5540;
  --warn:#DFAE4E; --warn-bg:#31260E; --warn-line:#5C4818;
  --wait:#E58B52; --wait-bg:#341C0F; --wait-line:#60351C;
  --crit:#F0847C; --crit-bg:#361817; --crit-line:#632C28;
  --info:#7EA9EE; --info-bg:#16233C; --info-line:#2A3F66;
  --mute:#93A6B7; --mute-bg:#1B2733; --mute-line:#2C3C4B;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 1px 2px rgba(0,0,0,.4), 0 10px 24px -14px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --bg:#0B121A; --surface:#121C26; --surface-2:#17232F; --surface-3:#1D2B39;
  --line:#243444; --line-2:#334557;
  --ink:#E6EEF6; --ink-2:#A6B8C8; --ink-3:#7A8E9F;
  --brand:#1A2D4C; --brand-2:#27405F; --brand-ink:#EAF1F8;
  --accent:#3BB5C0; --accent-2:#5fcdd6; --accent-soft:#12333a;
  --ok:#5CC08D; --ok-bg:#122E22; --ok-line:#1F5540;
  --warn:#DFAE4E; --warn-bg:#31260E; --warn-line:#5C4818;
  --wait:#E58B52; --wait-bg:#341C0F; --wait-line:#60351C;
  --crit:#F0847C; --crit-bg:#361817; --crit-line:#632C28;
  --info:#7EA9EE; --info-bg:#16233C; --info-line:#2A3F66;
  --mute:#93A6B7; --mute-bg:#1B2733; --mute-line:#2C3C4B;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 1px 2px rgba(0,0,0,.4), 0 10px 24px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.rail{width:232px;flex:0 0 232px;background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-top:env(safe-area-inset-top,0px)}
.rail-brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.rail-brand .mark{display:flex;align-items:center;gap:10px}
.rail-brand .dot{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:13px;color:#06222a}
.rail-brand h1{font-size:14.5px;font-weight:700;line-height:1.25}
.rail-brand p{margin:4px 0 0;font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.06em;text-transform:uppercase}
.nav{padding:10px 10px 20px;overflow-y:auto;flex:1}
.nav-group{margin-top:14px}
.nav-group>span{display:block;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.4);padding:0 8px 6px}
.nav button{width:100%;display:flex;align-items:center;gap:9px;background:none;border:0;color:rgba(255,255,255,.78);padding:8px 10px;border-radius:9px;cursor:pointer;text-align:left;font-size:13.5px;font-family:var(--disp);font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button[aria-current="true"]{background:var(--brand-2);color:#fff;font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
.nav .ico{width:16px;text-align:center;opacity:.9;font-size:13px}
.nav .badge{margin-left:auto;background:var(--crit);color:#fff;border-radius:20px;padding:1px 7px;font-size:11px;font-weight:700;font-family:var(--mono)}
:root[data-theme="dark"] .nav .badge,:root:not([data-theme="light"]) .nav .badge{color:#2a0a08}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .nav .badge{color:#fff}}
.rail-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.1);font-size:11.5px;color:rgba(255,255,255,.5)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 20px}
.search{flex:1;max-width:460px;position:relative;display:flex;align-items:center}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface-2)}
.search .s-ico{position:absolute;left:10px;color:var(--ink-3);font-size:13px}
.topbar .spacer{flex:1}
.chip-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);padding:7px 11px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500}
.chip-btn:hover{border-color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:var(--brand);color:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;font-family:var(--disp);font-weight:600;font-size:13px}
.btn:hover{background:var(--brand-2)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--surface-3)}
.btn.accent{background:var(--accent)}
.btn.accent:hover{background:var(--accent-2)}
.btn.danger{background:var(--crit-bg);color:var(--crit);border-color:var(--crit-line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm,.chip-btn.sm{padding:5px 9px;font-size:12px}
.bell{position:relative;border:1px solid var(--line-2);background:var(--surface);width:34px;height:34px;border-radius:9px;cursor:pointer;display:grid;place-items:center}
.bell .cnt{position:absolute;top:-6px;right:-6px;background:var(--crit);color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:1px 5px;font-family:var(--mono)}

.view{padding:20px;padding-block:20px;max-width:1500px;width:100%;margin:0 auto;flex:1}
.view-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.view-head h2{font-size:21px;font-weight:700}
.view-head p{margin:3px 0 0;color:var(--ink-2);font-size:13px;max-width:70ch}
.view-head .spacer{flex:1}
.eyebrow{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;font-family:var(--disp)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-1)}
.card>header{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.card>header h3{font-size:14.5px;font-weight:700}
.card>header .sub{font-size:12px;color:var(--ink-3)}
.card>header .spacer{flex:1}
.card .body{padding:14px 16px 16px}
.grid{display:grid;gap:14px}
.row-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.row-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.split-6040{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.split-4060{grid-template-columns:minmax(0,1fr) minmax(0,1.45fr)}
@media(max-width:1080px){.row-2,.row-3,.split-6040,.split-4060{grid-template-columns:minmax(0,1fr)}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;cursor:pointer;display:block;overflow:hidden;box-shadow:var(--shadow-1)}
.kpi:hover{border-color:var(--line-2);box-shadow:var(--shadow-2);transform:translateY(-1px)}
.kpi{transition:box-shadow .16s,transform .16s,border-color .16s}
@media(prefers-reduced-motion:reduce){.kpi{transition:none}}
.kpi .k-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;font-family:var(--disp)}
.kpi .k-val{font-family:var(--disp);font-weight:800;font-size:30px;line-height:1.05;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi .k-note{font-size:11.5px;color:var(--ink-2);margin-top:5px}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--mute-line)}
.kpi.t-total::before{background:var(--brand-2)} .kpi.t-open::before{background:var(--info)}
.kpi.t-wip::before{background:var(--info)} .kpi.t-our::before{background:var(--wait)}
.kpi.t-plat::before{background:var(--warn)} .kpi.t-follow::before{background:var(--warn)}
.kpi.t-over::before{background:var(--crit)} .kpi.t-res::before{background:var(--ok)}
.kpi.t-our .k-val{color:var(--wait)} .kpi.t-over .k-val{color:var(--crit)} .kpi.t-res .k-val{color:var(--ok)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap;font-family:var(--disp)}
.pill .pd{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}
.p-ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.p-warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.p-wait{color:var(--wait);background:var(--wait-bg);border-color:var(--wait-line)}
.p-crit{color:var(--crit);background:var(--crit-bg);border-color:var(--crit-line)}
.p-info{color:var(--info);background:var(--info-bg);border-color:var(--info-line)}
.p-mute{color:var(--mute);background:var(--mute-bg);border-color:var(--mute-line)}
.sev-bar{display:inline-block;width:3px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:6px}

/* tables */
.tw{overflow-x:auto;border-radius:var(--radius-sm)}
table{border-collapse:collapse;width:100%;font-size:12.8px}
th{text-align:left;font-family:var(--disp);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--surface-2);position:sticky;top:0;z-index:1}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.nowrap,th.nowrap{white-space:nowrap}
.tid{font-family:var(--mono);font-weight:600;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;font-size:12.5px}
.tid:hover{text-decoration:underline}
.muted{color:var(--ink-3)}
.clip{display:block;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:26px 16px;text-align:center;color:var(--ink-3);font-size:13px}

/* bars */
.barlist{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,2.4fr) auto;gap:10px;align-items:center;font-size:12.5px}
.barrow .lbl{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:9px;border-radius:6px;background:var(--surface-3);overflow:hidden;display:flex}
.track span{height:100%;display:block}
.barrow .val{font-family:var(--mono);font-weight:600;font-size:12px;min-width:28px;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11.5px;color:var(--ink-2)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:0}

.funnel{display:flex;flex-direction:column;gap:7px}
.fstage{display:grid;grid-template-columns:minmax(150px,auto) minmax(0,1fr) auto;gap:10px;align-items:center}
.fstage .fl{font-family:var(--disp);font-weight:600;font-size:12.5px}
.fstage .fl small{display:block;font-weight:400;font-size:10.5px;color:var(--ink-3);font-family:var(--sans)}
.fbar{height:26px;border-radius:7px;background:var(--surface-3);position:relative;overflow:hidden}
.fbar b{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.fstage .fv{font-family:var(--mono);font-weight:600;font-size:13px;min-width:32px;text-align:right}
.fdrop{font-size:11px;color:var(--ink-3);padding-left:4px}

.wbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wbox.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:980px){.wbox.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.wbox,.wbox.four{grid-template-columns:minmax(0,1fr)}}
.wcard{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;background:var(--surface-2)}
.wcard .wl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;font-family:var(--disp)}
.wcard .wn{font-family:var(--disp);font-weight:800;font-size:26px;margin-top:6px;font-variant-numeric:tabular-nums}
.wcard .wp{font-size:12px;color:var(--ink-2)}
.wcard.our{border-left:3px solid var(--wait)} .wcard.plat{border-left:3px solid var(--warn)} .wcard.other{border-left:3px solid var(--mute)}
.stackbar{display:flex;height:12px;border-radius:7px;overflow:hidden;margin-top:12px;background:var(--surface-3)}
.stackbar span{display:block}

/* forms */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:700px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:11.5px;font-weight:600;color:var(--ink-2);font-family:var(--disp)}
.field label .req{color:var(--crit)}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--surface);width:100%}
.field textarea{min-height:74px;resize:vertical}
.field .hint{font-size:11px;color:var(--ink-3)}
.field.err input,.field.err select,.field.err textarea{border-color:var(--crit)}
.field .errmsg{font-size:11px;color:var(--crit)}
fieldset{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin:0}
legend{font-family:var(--disp);font-weight:700;font-size:11.5px;padding:0 6px;color:var(--ink-2)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.filters .f{display:flex;flex-direction:column;gap:3px}
.filters label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700;font-family:var(--disp)}
.filters select,.filters input{padding:6px 8px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-size:12.5px;max-width:190px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips .c{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:2px 6px 2px 9px;font-size:11.5px;font-weight:600}
.chips .c button{border:0;background:none;cursor:pointer;color:inherit;font-size:13px;line-height:1;padding:0 2px}

/* modal / panel */
.scrim{position:fixed;inset:0;background:rgba(10,18,26,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 16px;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:820px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);border:1px solid var(--line)}
.modal.wide{max-width:1080px}
.modal>header{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;z-index:2}
.modal>header h3{font-size:16px;font-weight:700}
.modal>header .spacer{flex:1}
.modal .mbody{padding:18px}
.modal footer{display:flex;gap:9px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap}
.x{border:0;background:var(--surface-3);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1;color:var(--ink-2)}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line-2)}
.tl-item{position:relative;padding:0 0 16px}
.tl-item::before{content:"";position:absolute;left:-22px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2.5px solid var(--accent)}
.tl-item.k-esc::before{border-color:var(--crit)} .tl-item.k-res::before{border-color:var(--ok)}
.tl-item.k-plat::before{border-color:var(--warn)} .tl-item.k-fu::before{border-color:var(--wait)}
.tl-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tl-head b{font-family:var(--disp);font-size:13px}
.tl-meta{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.tl-body{font-size:13px;color:var(--ink-2);margin-top:3px}
.tl-extra{font-size:11.5px;color:var(--ink-3);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}

.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:12.8px;align-items:baseline}
.kv dt{color:var(--ink-3);font-size:11.5px;font-family:var(--disp);font-weight:600}
.kv dd{margin:0;word-break:break-word}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn);padding:10px 14px;border-radius:var(--radius-sm);font-size:12.8px;margin-bottom:14px}
.banner.crit{border-color:var(--crit-line);background:var(--crit-bg);color:var(--crit)}
.banner.info{border-color:var(--info-line);background:var(--info-bg);color:var(--info)}
.banner .btn.sm{flex:none}

<body>


<div class="app">
  <aside class="rail">
    <div class="rail-brand">
      <div class="mark"><span class="dot">TC</span><h1>Ticket Control Center</h1></div>
      <p>Amazon · Flipkart · DF</p>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="search">
        <span class="s-ico">⌕</span>
        <input id="globalSearch" type="search" placeholder="Search ticket ID, order ID, SKU/ASIN/FSN, issue, remarks…" aria-label="Global search">
      </div>

      <select id="roleSel" class="chip-btn sm" aria-label="Active role" style="padding:6px 8px"></select>
      <button class="bell" id="bellBtn" type="button" aria-label="Notifications">🔔<span class="cnt hidden" id="bellCnt">0</span></button>

    </div>
    <main class="view" id="view"></main>
  </div>
</div>
<div id="overlay"></div>
<div id="dialog"></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============ constants ============ */
const PLATFORMS = ['Amazon','Flipkart','Direct Fulfillment'];
const PLAT_SHORT = {'Amazon':'AMZ','Flipkart':'FK','Direct Fulfillment':'DF'};
const STATUSES = ['New','Open','Work in Progress','Waiting for Our Action','Waiting for Platform Reply','Follow-up Required','Escalated','Resolved','Closed'];
const DONE = ['Resolved','Closed'];
const PRIORITIES = ['Critical','High','Medium','Low'];
const CATEGORIES = ['Payment / Settlement','Reimbursement Claim','Return / RTO','Listing / Catalog','Inventory / Shipment','Order Cancellation','Damaged / Lost Shipment','Pricing / Buy Box','Account Health','Tax / Invoice','Tech / API Issue','Other'];
const DELAY_REASONS = ['Waiting for Amazon Reply','Waiting for Flipkart Reply','Waiting for DF Reply','Internal Action Pending','Information Required','Technical Issue','Escalation Pending','Customer/Buyer Information Required','Documentation Required','Other'];
const DELAY_OWNERS = ['Our Side','Platform Side','Third Party','Waiting for Information','Technical Issue','Other'];
const REPLY_FROM = ['Our Team','Amazon','Flipkart','Direct Fulfillment'];
const DEPARTMENTS = ['E-Commerce Operations','Accounts / Finance','Warehouse / Dispatch','Catalog','Customer Support','IT / Tech'];
const ACTION_TYPES = ['Ticket Raised','Internal Action','Reply Sent','Platform Reply','Follow-up','Escalation','Information Requested','Document Submitted','Resolution','Note'];
const ROLES = ['Admin','Manager','Team Member','Viewer'];
const AGE_BUCKETS = [{k:'0–2 Days',min:0,max:2},{k:'3–5 Days',min:3,max:5},{k:'6–10 Days',min:6,max:10},{k:'11–15 Days',min:11,max:15},{k:'16–30 Days',min:16,max:30},{k:'30+ Days',min:31,max:1e9}];
const FUNNEL = [
  {k:'New',        st:['New']},
  {k:'Open',       st:['Open']},
  {k:'Work in Progress', st:['Work in Progress','Waiting for Our Action']},
  {k:'Waiting for Platform', st:['Waiting for Platform Reply']},
  {k:'Follow-up',  st:['Follow-up Required','Escalated']},
  {k:'Resolved',   st:['Resolved']},
  {k:'Closed',     st:['Closed']}
];
const DEFAULTS = {
  team:['Pawan','Salman'],
  sla:{Critical:2,High:4,Medium:7,Low:14},
  alerts:{followup:3,attention:5,escalation:7},
  dueSoon:2,
  notify:{newTicket:true,followupDue:true,slaDue:true,overdue:true,noUpdate:true,escalation:true,resolved:true,channelInApp:true,channelEmail:false,channelWhatsapp:false,email:''}
};

/* ============ utils ============ */
const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY_MS = 86400000;
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function parseDate(v){
  if(!v && v!==0) return null;
  if(v instanceof Date) return isNaN(v)?null:new Date(v.getFullYear(),v.getMonth(),v.getDate());
  if(typeof v==='number'){ // excel serial
    if(v>20000 && v<80000){ const d=new Date(Math.round((v-25569)*DAY_MS)); return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()); }
    return null;
  }
  const s=String(v).trim(); if(!s) return null;
  let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){
    let y=+m[3]; if(y<100) y+=2000; return new Date(y,+m[2]-1,+m[1]);
  }
  if((m=s.match(/^(\d{1,2})[\-\s]([A-Za-z]{3,})[\-\s](\d{2,4})$/))){
    const mi=MON.findIndex(x=>x.toLowerCase()===m[2].slice(0,3).toLowerCase());
    if(mi>=0){ let y=+m[3]; if(y<100) y+=2000; return new Date(y,mi,+m[1]); }
  }
  const d=new Date(s); return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate());
}
const iso = d => d? d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') : '';
const fmt = v => { const d=parseDate(v); return d? String(d.getDate()).padStart(2,'0')+' '+MON[d.getMonth()]+' '+d.getFullYear() : ''; };
const fmtShort = v => { const d=parseDate(v); return d? String(d.getDate()).padStart(2,'0')+' '+MON[d.getMonth()] : ''; };
const daysBetween = (a,b)=> (!a||!b)?null:Math.round((b-a)/DAY_MS);
const addDays = (d,n)=> { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const uid = p => (p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pct = (n,d)=> d? Math.round(n*100/d) : 0;
const plural = (n,s)=> n+' '+s+(n===1?'':'s');
function relDay(v){
  const d=parseDate(v); if(!d) return '—';
  const n=daysBetween(d,today());
  if(n===0) return 'Today'; if(n===1) return 'Yesterday'; if(n===-1) return 'Tomorrow';
  return n>0? n+'d ago' : 'in '+(-n)+'d';
}
function toast(msg){
  const el=$('#toast'); el.innerHTML='<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.innerHTML='',3200);
}
function slaColorClass(s){ return s==='Overdue'?'p-crit':s==='Due Today'?'p-warn':s==='Due Soon'?'p-warn':s==='Closed'?'p-mute':'p-ok'; }
function statusClass(s){
  if(s==='Resolved') return 'p-ok'; if(s==='Closed') return 'p-mute';
  if(s==='Work in Progress'||s==='New'||s==='Open') return 'p-info';
  if(s==='Escalated') return 'p-crit';
  if(s==='Follow-up Required') return 'p-warn';
  return 'p-wait';
}
function prioClass(p){ return p==='Critical'?'p-crit':p==='High'?'p-wait':p==='Medium'?'p-warn':'p-mute'; }
function prioColor(p){ return p==='Critical'?'var(--crit)':p==='High'?'var(--wait)':p==='Medium'?'var(--warn)':'var(--mute)'; }
function platColor(p){ return p==='Amazon'?'var(--wait)':p==='Flipkart'?'var(--info)':'var(--accent)'; }
function waitClass(w){ return w==='Our Side'?'p-wait':w==='Platform Side'?'p-warn':w==='Other'?'p-mute':'p-ok'; }

/* ============ state ============ */
const state = {
  tickets: [], settings: JSON.parse(JSON.stringify(DEFAULTS)),
  view:'dashboard', filters:{}, search:'', page:1, perPage:25,
  sync:{mode:'local',status:'ok',msg:'',at:null}, localOnly:[],
  sort:{k:'urgency',dir:'desc'}, role:'Admin', canWrite:true, readNotifs:[], detail:null, reportTab:'daily'
};
function can(act){
  const r=state.role;
  if(!state.canWrite) return false;
  if(r==='Viewer') return false;
  if(r==='Team Member') return ['create','activity','remark'].includes(act);
  if(r==='Manager') return act!=='wipe';
  return true;
}

/* ============ automatic calculations ============ */
function derive(t){
  const S=state.settings, now=today();
  const created=parseDate(t.createdDate);
  const end=parseDate(t.actualResolutionDate||t.endDate);
  const closed=DONE.includes(t.status);
  const slaDays=(S.sla&&S.sla[t.priority]!=null)?S.sla[t.priority]:7;
  const target=parseDate(t.targetDate)||parseDate(t.expectedResolutionDate)||(created?addDays(created,slaDays):null);
  const age = created ? (closed&&end ? Math.max(0,daysBetween(created,end)) : Math.max(0,daysBetween(created,now))) : null;
  const daysOpen = closed?0:age;
  let delayDays=0;
  if(target){ const ref = closed&&end?end:now; delayDays=Math.max(0,daysBetween(target,ref)); }
  let sla='On Track';
  if(closed) sla='Closed';
  else if(!target) sla='No Target';
  else { const d=daysBetween(now,target); sla = d<0?'Overdue' : d===0?'Due Today' : d<=(S.dueSoon||2)?'Due Soon':'On Track'; }
  const lastUpdate = [parseDate(t.lastActionDate),parseDate(t.lastReplyDate),parseDate(t.ourLastResponseDate),parseDate(t.platformLastResponseDate),created]
    .filter(Boolean).sort((a,b)=>b-a)[0]||null;
  const noUpdateDays = (closed||!lastUpdate)?0:Math.max(0,daysBetween(lastUpdate,now));
  const A=S.alerts||DEFAULTS.alerts;
  let alertLevel='', alertText='';
  if(!closed){
    if(noUpdateDays>=A.escalation){alertLevel='crit';alertText='Escalation Required — no update for '+noUpdateDays+' days';}
    else if(noUpdateDays>=A.attention){alertLevel='wait';alertText='Attention Required — no update for '+noUpdateDays+' days';}
    else if(noUpdateDays>=A.followup){alertLevel='warn';alertText='Follow-up Reminder — no update for '+noUpdateDays+' days';}
  }
  let waiting='—';
  if(!closed){
    if(t.delayOwner==='Third Party'||t.delayOwner==='Waiting for Information') waiting='Other';
    else if(t.delayOwner==='Our Side') waiting='Our Side';
    else if(t.delayOwner==='Platform Side') waiting='Platform Side';
    else if(t.status==='Waiting for Our Action') waiting='Our Side';
    else if(t.status==='Waiting for Platform Reply'||t.status==='Escalated') waiting='Platform Side';
    else if(t.status==='Follow-up Required') waiting='Our Side';
    else if(t.delayOwner==='Technical Issue') waiting='Other';
    else waiting='Our Side';
  }
  const fu=parseDate(t.nextFollowupDate);
  const fuDue = !closed && fu ? daysBetween(now,fu)<=0 : false;
  const fuToday = !closed && fu ? daysBetween(now,fu)===0 : false;
  const resolutionTime = (end&&created)? Math.max(0,daysBetween(created,end)) : null;
  const bucket = age==null?null:(AGE_BUCKETS.find(b=>age>=b.min&&age<=b.max)||AGE_BUCKETS[AGE_BUCKETS.length-1]).k;
  const pw={Critical:400,High:300,Medium:200,Low:100}[t.priority]||100;
  let urgency=0;
  if(!closed){
    urgency = pw
      + (sla==='Overdue'?140:sla==='Due Today'?70:sla==='Due Soon'?30:0)
      + Math.min(delayDays,30)*4
      + (fuDue?45:0)
      + (alertLevel==='crit'?60:alertLevel==='wait'?35:alertLevel==='warn'?18:0)
      + (t.status==='Escalated'?70:0)
      + (waiting==='Our Side'?25:0);
  }
  /* smart status suggestion based on the latest activity / dates */
  let suggest='';
  const acts=(t.activities||[]).slice().sort((a,b)=>(parseDate(b.date)||0)-(parseDate(a.date)||0));
  const last=acts[0];
  if(!closed){
    if(t.actualResolutionDate||t.endDate) suggest='Resolved';
    else if(fuDue && t.status!=='Follow-up Required' && t.status!=='Escalated') suggest='Follow-up Required';
    else if(last) suggest = suggestFromActivity(last.type, t.status);
    if(suggest===t.status) suggest='';
  }
  return {closed,created,end,target,age,daysOpen,delayDays,sla,lastUpdate,noUpdateDays,alertLevel,alertText,waiting,fu,fuDue,fuToday,resolutionTime,bucket,urgency,suggest,slaDays};
}
function suggestFromActivity(type,cur){
  switch(type){
    case 'Resolution': return 'Resolved';
    case 'Escalation': return 'Escalated';
    case 'Reply Sent': case 'Document Submitted': case 'Follow-up': return 'Waiting for Platform Reply';
    case 'Platform Reply': return 'Waiting for Our Action';
    case 'Information Requested': return 'Waiting for Platform Reply';
    case 'Internal Action': return 'Work in Progress';
    case 'Ticket Raised': return 'Open';
    default: return cur;
  }
}
function actionReasons(t,d){
  const r=[];
  if(d.closed) return r;
  if(d.sla==='Overdue') r.push('SLA breached by '+plural(d.delayDays||Math.abs(daysBetween(today(),d.target)||0),'day'));
  if(d.sla==='Due Today') r.push('SLA due today');
  if(d.fuToday) r.push('Follow-up due today');
  else if(d.fuDue) r.push('Follow-up overdue');
  if(t.status==='Waiting for Our Action') r.push('Our action pending');
  if(t.status==='Escalated') r.push('Escalated — needs push');
  if(d.alertText) r.push(d.alertText);
  if((t.priority==='Critical'||t.priority==='High') && !d.closed && r.length===0) r.push(t.priority+' priority still open');
  return r;
}
function needsActionToday(t,d){ return !d.closed && actionReasons(t,d).length>0; }

/* ============ storage ============
   Three backends, chosen at boot:
   - 'artifact' : published on claude.ai → the artifact's shared store (live for everyone it is shared with)
   - 'sheet'    : GitHub Pages / local file with a Google Sheet connected → shared through Apps Script
   - 'local'    : nothing connected → this browser only (other people cannot see these tickets)
   localStorage is always kept as a cache + an outbox of changes that have not reached the shared store yet. */
/* Optional: paste your Apps Script Web App URL here before uploading to GitHub,
   so teammates only have to type the team key. */
const SHEET_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycby31gwRyfxpVv41mQF6A_SrVB65OTaaJG6Jl0eQ76fOrZt9_7DTr2y4Sov4_ptDUYgygQ/exec';

let DBX=null, USERX=null, DLX=null, unsubs=[], SHEET=null, sheetBusy=false;
let PENDING=new Set(), PENDING_DEL=new Set(), SYNCED=new Set();
/* saves/deletes made in this browser in the last few minutes (see sheetRefresh) */
const RECENT=new Map(), RECENT_DEL=new Map();
const LS='ectrl.v1', LS_SHEET='ectrl.sheet';
function stripUI(t){ const o=Object.assign({},t); delete o._d; return o; }
function setSync(mode,status,msg){
  state.sync={mode,status,msg:msg||'',at:status==='ok'?new Date():(state.sync&&state.sync.at)||null};
  if(typeof renderNav==='function' && document.getElementById('nav')) renderNav();
}
function saveLocal(){
  /* keep not-yet-uploaded browser-only tickets in the cache too, so a sync never drops them */
  const extra=(state.localOnly||[]).filter(t=>!state.tickets.some(x=>x.id===t.id));
  try{ localStorage.setItem(LS, JSON.stringify({tickets:state.tickets.concat(extra).map(stripUI),settings:state.settings,
    pending:[...PENDING],pendingDel:[...PENDING_DEL],synced:[...SYNCED]})); }catch(e){}
}
function readLocal(){
  try{ const o=JSON.parse(localStorage.getItem(LS)||'null'); return o&&Array.isArray(o.tickets)?o:null; }catch(e){ return null; }
}
function loadLocal(){
  const o=readLocal(); if(!o) return false;
  state.tickets=o.tickets;
  state.settings=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),o.settings||{});
  PENDING=new Set(o.pending||[]); PENDING_DEL=new Set(o.pendingDel||[]); SYNCED=new Set(o.synced||[]);
  return true;
}
function sheetCfg(){
  try{ const o=JSON.parse(localStorage.getItem(LS_SHEET)||'null'); if(o&&o.url) return o; }catch(_){}
  return SHEET_URL_DEFAULT?{url:SHEET_URL_DEFAULT,key:''}:null;
}
async function sheetCall(payload,cfg){
  const c=cfg||SHEET;
  let res;
  try{ res=await fetch(c.url,{method:'POST',body:JSON.stringify(Object.assign({key:c.key||''},payload))}); }
  catch(e){ throw new Error('Could not reach the Google Sheet. Check the Web App URL and that access is set to “Anyone”.'); }
  let j; try{ j=await res.json(); }catch(e){ throw new Error('The URL did not answer like the ticket Apps Script. Use the Web App URL that ends in /exec.'); }
  if(!j.ok) throw new Error(j.error||'The sheet refused the request.');
  return j;
}
/* pull from the sheet, merge with this browser's outbox, push the outbox */
async function sheetRefresh(){
  if(!SHEET||sheetBusy) return;
  sheetBusy=true;
  try{
    const j=await sheetCall({action:'list'});
    const server=(j.tickets||[]).filter(t=>t&&t.id);
    const serverIds=new Set(server.map(t=>t.id));
    const byId=new Map(server.filter(t=>!PENDING_DEL.has(t.id)).map(t=>[t.id,t]));
    const loc=readLocal()||{tickets:[]};
    const outbox=loc.tickets.filter(t=>PENDING.has(t.id));
    outbox.forEach(t=>byId.set(t.id,t));
    /* tickets created in this browser before sharing was connected */
    state.localOnly=loc.tickets.filter(t=>!serverIds.has(t.id)&&!SYNCED.has(t.id)&&!PENDING.has(t.id));
    if(outbox.length){ await sheetCall({action:'putMany',tickets:outbox.map(stripUI)}); outbox.forEach(t=>{PENDING.delete(t.id);SYNCED.add(t.id);}); }
    if(PENDING_DEL.size){ await sheetCall({action:'deleteMany',ids:[...PENDING_DEL]}); PENDING_DEL.clear(); }
    serverIds.forEach(id=>SYNCED.add(id));
    /* a save or delete made in this browser while the list was loading must not be undone on screen:
       keep our copy when the server's is missing or older, and keep recent deletes deleted */
    const cutoff=Date.now()-300000;
    RECENT.forEach((ts,id)=>{
      if(ts<cutoff){ RECENT.delete(id); return; }
      const cur=state.tickets.find(x=>x.id===id), sv=byId.get(id);
      if(cur && (!sv || String(sv.updatedAt||'')<String(cur.updatedAt||''))) byId.set(id,cur);
    });
    RECENT_DEL.forEach((ts,id)=>{ if(ts<cutoff) RECENT_DEL.delete(id); else byId.delete(id); });
    state.tickets=[...byId.values()];
    if(j.settings) state.settings=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),j.settings);
    saveLocal();
    setSync('sheet','ok');
  }catch(e){ setSync('sheet','error',e.message); }
  finally{ sheetBusy=false; }
}
function handleDbErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument'){
    state.canWrite=false;
    setSync('artifact','readonly','Your access to this dashboard is view-only, so this change was not saved for the team.');
  } else if(c==='quota_exceeded') setSync('artifact','error','Shared storage is full — delete old tickets before adding more.');
  else setSync('artifact','error','The last change did not reach the shared store ('+(c||'error')+'). Your teammates cannot see it yet.');
  saveLocal();
  render({background:true});
}
async function putTicket(t){
  t.updatedAt=new Date().toISOString(); RECENT.set(t.id,Date.now());
  const i=state.tickets.findIndex(x=>x.id===t.id);
  if(i<0) state.tickets.push(t); else state.tickets[i]=t;
  if(DBX){ try{ await DBX.collection('tickets').doc(t.id).set(stripUI(t)); }catch(e){ handleDbErr(e); } return; }
  if(SHEET){
    PENDING.add(t.id); saveLocal();
    try{ await sheetCall({action:'put',ticket:stripUI(t)}); PENDING.delete(t.id); SYNCED.add(t.id); setSync('sheet','ok'); }
    catch(e){ setSync('sheet','error',e.message); }
  }
  saveLocal();
}
async function putMany(list){
  list.forEach(t=>{ t.updatedAt=t.updatedAt||new Date().toISOString(); RECENT.set(t.id,Date.now()); const i=state.tickets.findIndex(x=>x.id===t.id); if(i<0) state.tickets.push(t); else state.tickets[i]=t; });
  if(DBX){
    for(const t of list){ try{ await DBX.collection('tickets').doc(t.id).set(stripUI(t)); }catch(e){ handleDbErr(e); break; } }
    return;
  }
  if(SHEET){
    list.forEach(t=>PENDING.add(t.id)); saveLocal();
    try{
      for(let i=0;i<list.length;i+=40){ await sheetCall({action:'putMany',tickets:list.slice(i,i+40).map(stripUI)}); list.slice(i,i+40).forEach(t=>{PENDING.delete(t.id);SYNCED.add(t.id);}); }
      setSync('sheet','ok');
    }catch(e){ setSync('sheet','error',e.message); }
  }
  saveLocal();
}
async function delTicket(id){
  state.tickets=state.tickets.filter(t=>t.id!==id);
  PENDING.delete(id); RECENT.delete(id); RECENT_DEL.set(id,Date.now());
  if(DBX){ try{ await DBX.collection('tickets').doc(id).delete(); }catch(e){ handleDbErr(e); } return; }
  if(SHEET){
    PENDING_DEL.add(id); saveLocal();
    try{ await sheetCall({action:'delete',id}); PENDING_DEL.delete(id); SYNCED.delete(id); setSync('sheet','ok'); }
    catch(e){ setSync('sheet','error',e.message); }
  }
  saveLocal();
}
async function saveSettings(){
  if(DBX){ try{ await DBX.doc('config/settings').set({v:state.settings}); }catch(e){ handleDbErr(e); } }
  else if(SHEET){ try{ await sheetCall({action:'settings',settings:state.settings}); }catch(e){ setSync('sheet','error',e.message); } }
  saveLocal();
}
async function wipeAll(){
  const ids=state.tickets.map(t=>t.id);
  state.tickets=[]; PENDING.clear();
  if(DBX){ for(const id of ids){ try{ await DBX.collection('tickets').doc(id).delete(); }catch(e){} } }
  else if(SHEET){ ids.forEach(id=>PENDING_DEL.add(id)); saveLocal();
    try{ await sheetCall({action:'deleteMany',ids}); PENDING_DEL.clear(); SYNCED.clear(); }catch(e){ setSync('sheet','error',e.message); } }
  saveLocal();
}
async function uploadLocalOnly(){
  const list=(state.localOnly||[]).slice();
  if(!list.length||!SHEET) return;
  await putMany(list);
  if(state.sync.status==='ok'){ state.localOnly=[]; toast('Uploaded '+plural(list.length,'ticket')+' to the shared sheet.'); }
  render({background:true});
}
async function mergeBackup(file){
  let o;
  try{ o=JSON.parse(await file.text()); }catch(e){ toast('That file is not a ticket backup (.json).'); return; }
  const incoming=Array.isArray(o)?o:(o&&o.tickets)||[];
  if(!incoming.length){ toast('No tickets found in that backup.'); return; }
  const changed=[];
  incoming.forEach(t=>{
    if(!t||!t.id) return;
    const cur=state.tickets.find(x=>x.id===t.id);
    if(!cur || String(t.updatedAt||'')>String(cur.updatedAt||'')) changed.push(t);
  });
  if(!changed.length){ toast('Everything in that backup is already here.'); return; }
  await putMany(changed);
  toast('Merged '+plural(changed.length,'ticket')+' from the backup.');
  render();
}

/* ============ filters & search ============ */
function matchSearch(t,q){
  if(!q) return true; q=q.toLowerCase();
  return [t.ticketId,t.orderId,t.sku,t.description,t.remarks,t.category,t.assignedTo,t.raisedBy,t.internalNotes,t.platform,t.status,t.delayReason]
    .some(v=>String(v||'').toLowerCase().includes(q));
}
function visibleTickets(){
  const f=state.filters;
  return state.tickets.filter(t=>{
    const d=t._d;
    if(f.platform && t.platform!==f.platform) return false;
    if(f.status && t.status!==f.status) return false;
    if(f.priority && t.priority!==f.priority) return false;
    if(f.category && t.category!==f.category) return false;
    if(f.assignedTo && t.assignedTo!==f.assignedTo) return false;
    if(f.raisedBy && t.raisedBy!==f.raisedBy) return false;
    if(f.waiting && d.waiting!==f.waiting) return false;
    if(f.delayReason && t.delayReason!==f.delayReason) return false;
    if(f.sla && d.sla!==f.sla) return false;
    if(f.bucket && d.bucket!==f.bucket) return false;
    if(f.ticketId && !String(t.ticketId||'').toLowerCase().includes(f.ticketId.toLowerCase())) return false;
    if(f.from && d.created && d.created<parseDate(f.from)) return false;
    if(f.to && d.created && d.created>parseDate(f.to)) return false;
    if(f.fuDate){ const fd=parseDate(f.fuDate); if(!d.fu||+d.fu!==+fd) return false; }
    if(f.group==='open' && d.closed) return false;
    if(f.group==='overdue' && !(d.sla==='Overdue')) return false;
    if(f.group==='fuDue' && !d.fuDue) return false;
    if(f.group==='resolved' && t.status!=='Resolved') return false;
    if(f.group==='action' && !needsActionToday(t,d)) return false;
    if(f.group==='noupdate' && !d.alertLevel) return false;
    if(!matchSearch(t,state.search)) return false;
    return true;
  });
}
function sortTickets(list){
  const {k,dir}=state.sort, s=dir==='asc'?1:-1;
  const val=(t)=>{
    const d=t._d;
    switch(k){
      case 'urgency': return d.urgency;
      case 'age': return d.age||0;
      case 'created': return d.created?+d.created:0;
      case 'ticketId': return String(t.ticketId||'').toLowerCase();
      case 'platform': return t.platform;
      case 'status': return STATUSES.indexOf(t.status);
      case 'priority': return -PRIORITIES.indexOf(t.priority);
      case 'fu': return d.fu?+d.fu:Infinity;
      case 'update': return d.lastUpdate?+d.lastUpdate:0;
      case 'delay': return d.delayDays;
      default: return 0;
    }
  };
  return list.slice().sort((a,b)=>{ const x=val(a),y=val(b); return x<y?-s:x>y?s:0; });
}
function recompute(){ state.tickets.forEach(t=>{ t._d=derive(t); }); }

/* ============ notifications ============ */
function buildNotifications(){
  const N=state.settings.notify||DEFAULTS.notify, out=[];
  state.tickets.forEach(t=>{
    const d=t._d;
    if(d.closed){
      if(N.resolved && t.status==='Resolved' && d.end && daysBetween(d.end,today())<=1)
        out.push({id:t.id+':res',tid:t.id,kind:'ok',title:'Ticket resolved',body:t.ticketId+' — '+t.description});
      return;
    }
    if(N.escalation && t.status==='Escalated') out.push({id:t.id+':esc',tid:t.id,kind:'crit',title:'Escalated ticket open',body:t.ticketId+' · '+t.platform});
    if(N.overdue && d.sla==='Overdue') out.push({id:t.id+':od',tid:t.id,kind:'crit',title:'Overdue — '+plural(d.delayDays,'day')+' past target',body:t.ticketId+' · '+t.platform});
    else if(N.slaDue && d.sla==='Due Today') out.push({id:t.id+':sla',tid:t.id,kind:'warn',title:'SLA due today',body:t.ticketId+' · '+t.platform});
    if(N.followupDue && d.fuToday) out.push({id:t.id+':fu',tid:t.id,kind:'warn',title:'Follow-up due today',body:t.ticketId+' — '+(t.assignedTo||'Unassigned')});
    if(N.noUpdate && d.alertLevel) out.push({id:t.id+':nu',tid:t.id,kind:d.alertLevel,title:d.alertText.split(' — ')[0],body:t.ticketId+' — no update for '+plural(d.noUpdateDays,'day')});
    if(N.newTicket && t.status==='New' && d.created && daysBetween(d.created,today())<=1)
      out.push({id:t.id+':new',tid:t.id,kind:'info',title:'New ticket created',body:t.ticketId+' · '+t.platform+' · raised by '+(t.raisedBy||'—')});
  });
  const rank={crit:0,wait:1,warn:2,info:3,ok:4};
  return out.sort((a,b)=>(rank[a.kind]??9)-(rank[b.kind]??9));
}

function donut(items,centerVal,centerLbl){
  const total=items.reduce((a,b)=>a+b.v,0)||1; const R=54,C=2*Math.PI*R; let off=0;
  const segs=items.filter(i=>i.v>0).map(i=>{

  }).join('');

   '<svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="Status distribution"><circle r="54" cx="70" cy="70" fill="none" stroke="var(--surface-3)" stroke-width="20"></circle>'+segs+

     '<div class="barrow" style="grid-template-columns:minmax(0,1fr) auto auto;gap:8px"><span class="lbl"><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:'+i.c+';margin-right:7px"></i>'+esc(i.k)+'</span><span class="val">'+i.v+'</span><span class="val muted">'+pct(i.v,total)+'%</span></div>').join('')+'</div></div></div>';

function colChart(items){
  const W=520,H=180,pad={l:34,r:8,t:14,b:30}, max=Math.max(1,...items.map(i=>i.v));
  const step=(W-pad.l-pad.r)/items.length, bw=Math.min(52,step*0.6);
  const ticks=[0,Math.ceil(max/2),max];
  let g=ticks.map(v=>{const y=H-pad.b-(v/max)*(H-pad.t-pad.b);
    return '<line x1="'+pad.l+'" x2="'+(W-pad.r)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"></line><text x="'+(pad.l-6)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">'+v+'</text>';}).join('');
  let bars=items.map((i,n)=>{
    const h=(i.v/max)*(H-pad.t-pad.b), x=pad.l+step*n+(step-bw)/2, y=H-pad.b-h;
    return '<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,i.v?2:0)+'" rx="4" fill="'+(i.c||'var(--accent)')+'"></rect>'+
      (i.v?'<text x="'+(x+bw/2)+'" y="'+(y-5)+'" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono,monospace">'+i.v+'</text>':'')+
      '<text x="'+(x+bw/2)+'" y="'+(H-pad.b+14)+'" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-family="IBM Plex Sans,sans-serif">'+esc(i.k)+'</text>';
  }).join('');
  return '<svg class="ageing-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ticket ageing buckets">'+g+bars+'<line x1="'+pad.l+'" x2="'+(W-pad.r)+'" y1="'+(H-pad.b)+'" y2="'+(H-pad.b)+'" stroke="var(--line-2)"></line></svg>';
}

/* ============ KPI computation ============ */
function kpis(){
  const t=state.tickets, d=x=>x._d;
  const open=t.filter(x=>!d(x).closed);
  return {
    total:t.length,
    open:open.length,
    wip:t.filter(x=>x.status==='Work in Progress').length,
    our:open.filter(x=>d(x).waiting==='Our Side').length,
    plat:open.filter(x=>d(x).waiting==='Platform Side').length,
    fu:open.filter(x=>d(x).fuToday).length,
    fuDue:open.filter(x=>d(x).fuDue).length,
    overdue:open.filter(x=>d(x).sla==='Overdue').length,
    resolved:t.filter(x=>x.status==='Resolved').length,
    closed:t.filter(x=>x.status==='Closed').length,
    critical:open.filter(x=>x.priority==='Critical').length,
    escalated:open.filter(x=>x.status==='Escalated').length,
    action:open.filter(x=>needsActionToday(x,d(x))).length,
    noupdate:open.filter(x=>d(x).alertLevel).length,
    dueToday:open.filter(x=>d(x).sla==='Due Today').length,
    dueSoon:open.filter(x=>d(x).sla==='Due Soon').length,
    onTrack:open.filter(x=>d(x).sla==='On Track').length,
    other:open.filter(x=>d(x).waiting==='Other').length
  };
}
function avgResolution(list){
  const v=list.map(x=>x._d.resolutionTime).filter(x=>x!=null);
  return v.length? Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10 : null;
}

   '<div class="barlist">'+platRows.map(r=>
     '<div class="barrow" style="grid-template-columns:minmax(110px,auto) minmax(0,1fr) auto"><span class="lbl"><b>'+esc(r.p)+'</b></span>'+
     '<span class="track" title="'+r.our+' with us, '+r.plat+' with platform, '+r.resolved+' closed">'+
       '<span style="width:'+(r.our/maxTot*100)+'%;background:var(--wait)"></span>'+
       '<span style="width:'+(r.plat/maxTot*100)+'%;background:var(--warn)"></span>'+
       '<span style="width:'+((r.open-r.our-r.plat)/maxTot*100)+'%;background:var(--mute)"></span>'+
       '<span style="width:'+(r.resolved/maxTot*100)+'%;background:var(--ok)"></span>'+
     '</span><span class="val">'+r.total+'</span></div>').join('')+'</div>'+
   '<div class="legend"><span><i style="background:var(--wait)"></i>Waiting for our action</span><span><i style="background:var(--warn)"></i>Waiting for platform</span><span><i style="background:var(--mute)"></i>Other open</span><span><i style="background:var(--ok)"></i>Resolved / closed</span></div>'+
   '<div class="tw" style="margin-top:14px"><table><thead><tr><th>Platform</th><th class="num">Total</th><th class="num">Open</th><th class="num">Waiting: us</th><th class="num">Waiting: platform</th><th class="num">Overdue</th><th class="num">Resolved</th><th class="nowrap">Avg. resolution</th></tr></thead><tbody>'+
   platRows.map(r=>'<tr><td class="nowrap"><b>'+esc(r.p)+'</b></td><td class="num">'+r.total+'</td><td class="num">'+r.open+'</td><td class="num">'+r.our+'</td><td class="num">'+r.plat+'</td><td class="num">'+(r.overdue?'<span class="pill p-crit">'+r.overdue+'</span>':'0')+'</td><td class="num">'+r.resolved+'</td><td class="nowrap">'+(r.avg==null?'<span class="muted">—</span>':r.avg+' days')+'</td></tr>').join('')+
   '</tbody></table></div>'+
   '<p class="note">Highest pending load: <b>'+esc(platRows.slice().sort((a,b)=>b.open-a.open)[0].p)+'</b> with '+platRows.slice().sort((a,b)=>b.open-a.open)[0].open+' open tickets.</p>'+
   '</div></section>';

  /* status distribution */
  const stColors={'New':'var(--info)','Open':'var(--info)','Work in Progress':'var(--info)','Waiting for Our Action':'var(--wait)','Waiting for Platform Reply':'var(--warn)','Follow-up Required':'var(--warn)','Escalated':'var(--crit)','Resolved':'var(--ok)','Closed':'var(--mute)'};
  const stItems=STATUSES.map(s=>({k:s,v:t.filter(x=>x.status===s).length,c:stColors[s]}));
  const statusCard='<section class="card"><header><h3>Status distribution</h3></header><div class="body">'+donut(stItems,k.open,'open now')+'</div></section>';

  /* funnel */
  const fCounts=FUNNEL.map(f=>({k:f.k,st:f.st,v:t.filter(x=>f.st.includes(x.status)).length}));
  const fMax=Math.max(1,...fCounts.map(f=>f.v));
  const funnelCard='<section class="card"><header><h3>Ticket status funnel</h3><span class="spacer"></span><span class="sub">Where tickets are sitting right now</span></header><div class="body"><div class="funnel">'+
    fCounts.map((f,i)=>{
      const col=i<2?'var(--info)':i===2?'var(--info)':i===3?'var(--warn)':i===4?'var(--wait)':i===5?'var(--ok)':'var(--mute)';
      return '<div class="fstage"><span class="fl">'+esc(f.k)+'<small>'+esc(f.st.join(' · '))+'</small></span>'+
      '<span class="fbar"><b style="width:'+Math.max(f.v/fMax*100,f.v?4:0)+'%;background:'+col+'"></b></span><span class="fv">'+f.v+'</span></div>';
    }).join('')+'</div>'+
    '<p class="note">Biggest hold-up: <b>'+esc(fCounts.filter((f,i)=>i<5).sort((a,b)=>b.v-a.v)[0].k)+'</b> — '+fCounts.filter((f,i)=>i<5).sort((a,b)=>b.v-a.v)[0].v+' tickets parked at this stage.</p></div></section>';

  /* delay analysis */
  const delayCard=delayReasonCard();
  const ageCard=ageingCard();
  /* action required preview */
  const actList=sortTickets(t.filter(x=>needsActionToday(x,x._d))).slice(0,8);
  const actionCard='<section class="card"><header><h3>Action required today</h3><span class="pill p-crit">'+k.action+'</span><span class="spacer"></span><button class="btn sm ghost" data-go="action">Open full list</button></header><div class="body"><div class="tw"><table><thead><tr><th class="nowrap">Priority</th><th class="nowrap">Ticket</th><th class="nowrap">Platform</th><th>Issue</th><th class="nowrap">Waiting With</th><th class="num">Days open</th><th>Action required</th></tr></thead><tbody>'+
    (actList.length?actList.map(x=>'<tr><td class="nowrap">'+prioPill(x.priority)+'</td><td class="nowrap">'+tlink(x)+'</td><td class="nowrap">'+platTag(x.platform)+'</td><td><span class="clip" title="'+esc(x.description)+'">'+esc(x.description)+'</span></td><td class="nowrap">'+waitPill(x._d.waiting)+'</td><td class="num">'+x._d.daysOpen+'</td><td>'+esc(actionReasons(x,x._d).join(' · '))+'</td></tr>').join(''):emptyRow(7,'Nothing needs attention today.'))+
    '</tbody></table></div></div></section>';

  const overdueList=sortTickets(t.filter(x=>x._d.sla==='Overdue')).slice(0,8);
  const overdueCard='<section class="card"><header><h3>Overdue tickets</h3><span class="pill p-crit">'+k.overdue+'</span><span class="spacer"></span><button class="btn sm ghost" data-kpi="overdue">Open</button></header><div class="body"><div class="tw"><table><thead><tr><th class="nowrap">Ticket</th><th class="nowrap">Platform</th><th class="num">Days late</th><th class="nowrap">Status</th><th>Delay reason</th><th class="nowrap">Owner</th></tr></thead><tbody>'+
    (overdueList.length?overdueList.map(x=>'<tr><td class="nowrap">'+tlink(x)+'</td><td class="nowrap">'+platTag(x.platform)+'</td><td class="num"><b style="color:var(--crit)">'+x._d.delayDays+'</b></td><td class="nowrap">'+statusPill(x.status)+'</td><td><span class="clip">'+esc(x.delayReason||'Not recorded')+'</span></td><td class="nowrap">'+esc(x.assignedTo||'—')+'</td></tr>').join(''):emptyRow(6,'No overdue tickets.'))+
    '</tbody></table></div></div></section>';

  /* recent activity */
  const recent=[];
  t.forEach(x=>(x.activities||[]).forEach(a=>recent.push({t:x,a})));
  recent.sort((p,q)=>{ const dp=parseDate(p.a.date),dq=parseDate(q.a.date); return (dq?+dq:0)-(dp?+dp:0) || String(q.a.time||'').localeCompare(String(p.a.time||'')); });
  const recentCard='<section class="card"><header><h3>Recent ticket activity</h3><span class="spacer"></span><button class="btn sm ghost" data-go="activity">Full activity log</button></header><div class="body"><div class="tw"><table><thead><tr><th class="nowrap">Date</th><th class="nowrap">Ticket</th><th class="nowrap">Action by</th><th class="nowrap">Action type</th><th>Description</th><th class="nowrap">Reply from</th></tr></thead><tbody>'+
    (recent.length?recent.slice(0,10).map(r=>'<tr><td class="nowrap mono">'+esc(fmt(r.a.date))+'</td><td class="nowrap">'+tlink(r.t)+'</td><td class="nowrap">'+esc(r.a.by||'—')+'</td><td class="nowrap">'+esc(r.a.type)+'</td><td><span class="clip" title="'+esc(r.a.desc)+'">'+esc(r.a.desc)+'</span></td><td class="nowrap">'+esc(r.a.replyFrom||'—')+'</td></tr>').join(''):emptyRow(6,'No activity recorded yet.'))+
    '</tbody></table></div></div></section>';

  return storageBanner()+dashHead()+
    kpiRow+
    '<div class="grid split-6040" style="margin-top:14px">'+platCard+statusCard+'</div>'+
    '<div class="grid split-4060" style="margin-top:14px">'+funnelCard+delayCard+'</div>'+
    '<div class="grid split-6040" style="margin-top:14px">'+waitingCard()+ageCard+'</div>'+
    '<div class="grid split-6040" style="margin-top:14px">'+actionCard+overdueCard+'</div>'+
    '<div style="margin-top:14px">'+recentCard+'</div>';
}

function delayReasonCard(){
  const open=state.tickets.filter(x=>!x._d.closed);
  const delayed=open.filter(x=>x._d.delayDays>0||x.delayReason);
  const rows=DELAY_REASONS.map(r=>{
    const l=delayed.filter(x=>x.delayReason===r);
    return {k:r,v:l.length,days:l.reduce((a,b)=>a+b._d.delayDays,0)};
  }).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  const unrec=delayed.filter(x=>!x.delayReason).length;
  if(unrec) rows.push({k:'Not recorded yet',v:unrec,days:delayed.filter(x=>!x.delayReason).reduce((a,b)=>a+b._d.delayDays,0)});
  const maxV=Math.max(1,...rows.map(r=>r.v)), maxD=Math.max(1,...rows.map(r=>r.days));
  return '<section class="card"><header><h3>Why tickets are delayed</h3><span class="spacer"></span><span class="sub">'+delayed.length+' delayed / at-risk</span></header><div class="body">'+
   (rows.length?'<div class="tw"><table><thead><tr><th>Delay reason</th><th style="width:34%">Tickets</th><th class="num nowrap">Count</th><th style="width:26%">Delay days</th><th class="num nowrap">Total</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td><button class="tid" data-filter-delay="'+esc(r.k)+'" style="color:var(--ink);font-family:var(--sans)">'+esc(r.k)+'</button></td>'+
      '<td><span class="track"><span style="width:'+(r.v/maxV*100)+'%;background:var(--wait)"></span></span></td><td class="num"><b>'+r.v+'</b></td>'+
      '<td><span class="track"><span style="width:'+(r.days/maxD*100)+'%;background:var(--crit)"></span></span></td><td class="num">'+r.days+'d</td></tr>').join('')+
    '</tbody></table></div><p class="note">Top cause: <b>'+esc(rows[0].k)+'</b> — '+rows[0].v+' tickets, '+rows[0].days+' cumulative delay days.</p>'
    :'<div class="empty">No delayed tickets. Everything is inside its target date.</div>')+
   '</div></section>';
}

function waitingCard(){
  const open=state.tickets.filter(x=>!x._d.closed), n=open.length||1;
  const g={'Our Side':[],'Platform Side':[],'Other':[]};
  open.forEach(x=>{ (g[x._d.waiting]||g['Other']).push(x); });
  const box=(key,cls,label,desc)=>{
    const l=g[key], p=pct(l.length,n);
    const oldest=l.slice().sort((a,b)=>b._d.age-a._d.age)[0];
    return '<button class="wcard '+cls+'" data-filter-wait="'+key+'" style="text-align:left;cursor:pointer;width:100%">'+
      '<div class="wl" style="color:'+(cls==='our'?'var(--wait)':cls==='plat'?'var(--warn)':'var(--mute)')+'">'+esc(label)+'</div>'+
      '<div class="wn">'+l.length+' <span style="font-size:14px;color:var(--ink-3)">· '+p+'%</span></div>'+
      '<div class="wp">'+esc(desc)+'</div>'+
      (oldest?'<div class="mono-sm" style="margin-top:6px">Oldest: '+esc(oldest.ticketId)+' · '+oldest._d.age+'d</div>':'')+
    '</button>';
  };
  return '<section class="card"><header><h3>Ticket waiting with</h3><span class="spacer"></span><span class="sub">'+open.length+' open tickets</span></header><div class="body">'+
    '<div class="wbox">'+
      box('Our Side','our','Our side','Our team must reply or act next.')+
      box('Platform Side','plat','Platform side','Amazon / Flipkart / DF must respond.')+
      box('Other','other','Other','Third party, buyer, vendor or missing information.')+
    '</div>'+
    '<div class="stackbar">'+
      '<span style="width:'+pct(g['Our Side'].length,n)+'%;background:var(--wait)"></span>'+
      '<span style="width:'+pct(g['Platform Side'].length,n)+'%;background:var(--warn)"></span>'+
      '<span style="width:'+pct(g['Other'].length,n)+'%;background:var(--mute)"></span>'+
    '</div>'+
    '<p class="note">'+(g['Our Side'].length>g['Platform Side'].length
      ? 'Most of the backlog is <b>internal</b> — '+pct(g['Our Side'].length,n)+'% of open tickets are waiting on our team.'
      : 'Most of the backlog is <b>platform-side</b> — '+pct(g['Platform Side'].length,n)+'% of open tickets are waiting on Amazon / Flipkart / DF.')+'</p>'+
  '</div></section>';
}

function ageingCard(){
  const open=state.tickets.filter(x=>!x._d.closed);
  const items=AGE_BUCKETS.map((b,i)=>({k:b.k.replace(' Days',''),v:open.filter(x=>x._d.bucket===b.k).length,c:['var(--ok)','var(--ok)','var(--warn)','var(--wait)','var(--crit)','var(--crit)'][i]}));
  return '<section class="card"><header><h3>Ticket ageing</h3><span class="spacer"></span><span class="sub">Open tickets by days since creation</span></header><div class="body">'+colChart(items)+
   '<div class="legend"><span><i style="background:var(--ok)"></i>Fresh (0–5 days)</span><span><i style="background:var(--warn)"></i>Watch (6–10)</span><span><i style="background:var(--wait)"></i>Ageing (11–15)</span><span><i style="background:var(--crit)"></i>Stale (16+ days)</span></div></div></section>';
}

/* ============ view: tickets ============ */

  const f=state.filters;
  const sel=(key,label,opts,val)=>'<div class="f"><label for="flt_'+key+'">'+esc(label)+'</label><select id="flt_'+key+'" data-flt="'+key+'"><option value="">All</option>'+opts.map(o=>'<option value="'+esc(o)+'"'+(val===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select></div>';
  const team=Array.from(new Set(state.settings.team.concat(state.tickets.map(t=>t.assignedTo).filter(Boolean))));
  const raisers=Array.from(new Set(state.settings.team.concat(state.tickets.map(t=>t.raisedBy).filter(Boolean))));
  return '<div class="card no-print"><div class="body"><div class="filters">'+
    sel('platform','Platform',PLATFORMS,f.platform)+

    sel('raisedBy','Raised by',raisers,f.raisedBy)+

    sel('delayReason','Delay reason',DELAY_REASONS,f.delayReason)+
    sel('sla','SLA status',['On Track','Due Soon','Due Today','Overdue','Closed','No Target'],f.sla)+

    '<div class="f"><label for="flt_ticketId">Ticket ID</label><input id="flt_ticketId" data-flt="ticketId" value="'+esc(f.ticketId||'')+'" placeholder="e.g. AMZ-904"></div>'+
    '<div class="f"><label for="flt_from">Created from</label><input id="flt_from" type="date" data-flt="from" value="'+esc(f.from||'')+'"></div>'+
    '<div class="f"><label for="flt_to">Created to</label><input id="flt_to" type="date" data-flt="to" value="'+esc(f.to||'')+'"></div>'+
    '<div class="f"><label for="flt_fuDate">Follow-up date</label><input id="flt_fuDate" type="date" data-flt="fuDate" value="'+esc(f.fuDate||'')+'"></div>'+
    '<button class="chip-btn sm" data-act="clearFilters">Clear filters</button>'+
  '</div>'+activeChips()+'</div></div>';

function activeChips(){
  const labels={platform:'Platform',status:'Status',priority:'Priority',category:'Category',assignedTo:'Assigned',raisedBy:'Raised by',waiting:'Waiting with',delayReason:'Delay',sla:'SLA',bucket:'Ageing',ticketId:'ID',from:'From',to:'To',fuDate:'Follow-up',group:'View'};
  const groupNames={all:'All tickets',open:'Open',wip:'Work in progress',our:'Waiting for our action',plat:'Waiting for platform',fuToday:'Follow-up due today',overdue:'Overdue',resolved:'Resolved',action:'Action required',noupdate:'No update alerts'};
  const chips=Object.keys(state.filters).filter(k=>state.filters[k]).map(k=>{
    const v=k==='group'?(groupNames[state.filters[k]]||state.filters[k]):state.filters[k];
    return '<span class="c">'+esc(labels[k]||k)+': '+esc(v)+'<button data-rmflt="'+k+'" aria-label="Remove filter">×</button></span>';
  });
  if(state.search) chips.unshift('<span class="c">Search: '+esc(state.search)+'<button data-rmflt="__search" aria-label="Clear search">×</button></span>');
  return chips.length?'<div class="chips">'+chips.join('')+'</div>':'';
}
function viewTickets(){
  const all=sortTickets(visibleTickets());
  const pages=Math.max(1,Math.ceil(all.length/state.perPage));
  if(state.page>pages) state.page=pages;
  const slice=all.slice((state.page-1)*state.perPage,state.page*state.perPage);
  const k=kpis();
  if(!state.tickets.length) return storageBanner()+'<div class="view-head"><div><span class="eyebrow">Ticket master</span><h2>All tickets</h2></div></div>'+startCard();
  return storageBanner()+'<div class="view-head"><div><span class="eyebrow">Ticket master</span><h2>All tickets</h2><p>The core operational table — one row tells you the status, who is holding it, how long it has been open and why it is delayed.</p></div><div class="spacer"></div>'+
  '<button class="btn ghost no-print" data-act="exportCsv">Export CSV</button><button class="btn ghost no-print" data-act="exportXlsx">Export Excel</button>'+(can('create')?'<button class="btn accent no-print" data-act="new">+ Raise Ticket</button>':'')+'</div>'+
  '<div class="stat-inline" style="margin-bottom:12px"><div><b>'+all.length+'</b><span>Shown</span></div><div><b>'+k.open+'</b><span>Open</span></div><div><b style="color:var(--wait)">'+k.our+'</b><span>With us</span></div><div><b style="color:var(--warn)">'+k.plat+'</b><span>With platform</span></div><div><b style="color:var(--crit)">'+k.overdue+'</b><span>Overdue</span></div><div><b style="color:var(--ok)">'+k.resolved+'</b><span>Resolved</span></div></div>'+
  filterBar()+
  '<section class="card" style="margin-top:14px"><div class="body"><div class="tw"><table><thead>'+CORE_HEAD+'</thead><tbody>'+

  '</tbody></table></div>'+
  '<div class="pager no-print"><span>Page '+state.page+' of '+pages+' · '+all.length+' tickets</span>'+
   '<button class="chip-btn sm" data-page="'+(state.page-1)+'"'+(state.page<=1?' disabled':'')+'>Previous</button>'+
   '<button class="chip-btn sm" data-page="'+(state.page+1)+'"'+(state.page>=pages?' disabled':'')+'>Next</button>'+
   '<select data-act="perPage" aria-label="Rows per page">'+[25,50,100,250].map(n=>'<option value="'+n+'"'+(state.perPage===n?' selected':'')+'>'+n+' / page</option>').join('')+'</select>'+
  '</div></div></section>';
}

/* ============ view: action today ============ */
function viewAction(){
  const open=state.tickets.filter(x=>!x._d.closed);
  const list=sortTickets(open.filter(x=>needsActionToday(x,x._d)));
  const alerts={crit:[],wait:[],warn:[]};
  open.forEach(x=>{ if(x._d.alertLevel) alerts[x._d.alertLevel].push(x); });
  const A=state.settings.alerts;
  const alertBlock=(key,cls,title,sub)=>{
    const l=alerts[key].sort((a,b)=>b._d.noUpdateDays-a._d.noUpdateDays);
    return '<section class="card"><header><h3>'+esc(title)+'</h3><span class="pill '+cls+'">'+l.length+'</span><span class="spacer"></span><span class="sub">'+esc(sub)+'</span></header><div class="body"><div class="tw"><table><thead><tr><th class="nowrap">Ticket</th><th class="nowrap">Platform</th><th>Issue</th><th class="nowrap">Last update</th><th class="num">Idle days</th><th class="nowrap">Assigned</th></tr></thead><tbody>'+
     (l.length?l.map(x=>'<tr><td class="nowrap">'+tlink(x)+'</td><td class="nowrap">'+platTag(x.platform)+'</td><td><span class="clip" title="'+esc(x.description)+'">'+esc(x.description)+'</span></td><td class="nowrap">'+esc(x._d.lastUpdate?fmt(x._d.lastUpdate):'—')+'</td><td class="num"><b>'+x._d.noUpdateDays+'</b></td><td class="nowrap">'+esc(x.assignedTo||'—')+'</td></tr>').join(''):emptyRow(6,'None in this band.'))+
     '</tbody></table></div></div></section>';
  };
  return storageBanner()+'<div class="view-head"><div><span class="eyebrow">Daily working list · '+fmt(today())+'</span><h2>Action required today</h2><p>Sorted by urgency: priority, SLA breach, follow-up date and days without an update. Work top-down.</p></div><div class="spacer"></div><button class="btn ghost no-print" data-act="print">Print list</button></div>'+
  '<section class="card"><header><h3>Today\'s queue</h3><span class="pill p-crit">'+list.length+' tickets</span><span class="spacer"></span><span class="sub">Follow-up due · SLA due or breached · our action pending · idle tickets · open Critical/High</span></header><div class="body"><div class="tw"><table><thead><tr><th class="nowrap">Priority</th><th class="nowrap">Ticket ID</th><th class="nowrap">Platform</th><th>Issue</th><th class="nowrap">Status</th><th class="nowrap">Waiting With</th><th class="num">Days open</th><th class="nowrap">Last update</th><th class="nowrap">Next follow-up</th><th class="nowrap">Assigned to</th><th>Action required</th></tr></thead><tbody>'+
   (list.length?list.map(x=>{
     const d=x._d;
     return '<tr><td class="nowrap"><span class="sev-bar" style="background:'+prioColor(x.priority)+'"></span>'+esc(x.priority)+'</td>'+
     '<td class="nowrap">'+tlink(x)+'</td><td class="nowrap">'+platTag(x.platform)+'</td>'+
     '<td><span class="clip" title="'+esc(x.description)+'">'+esc(x.description)+'</span></td>'+
     '<td class="nowrap">'+statusPill(x.status)+'</td><td class="nowrap">'+waitPill(d.waiting)+'</td>'+
     '<td class="num"><b>'+d.daysOpen+'</b></td><td class="nowrap">'+esc(d.lastUpdate?relDay(d.lastUpdate):'—')+'</td>'+
     '<td class="nowrap">'+(d.fu?(d.fuDue?'<span class="pill p-warn">'+fmt(d.fu)+'</span>':fmt(d.fu)):'<span class="muted">not set</span>')+'</td>'+
     '<td class="nowrap">'+esc(x.assignedTo||'—')+'</td>'+
     '<td>'+actionReasons(x,d).map(r=>'<div>• '+esc(r)+'</div>').join('')+'</td></tr>';
   }).join(''):emptyRow(11,'Clear — no ticket needs attention today.'))+

  return out;
}

/* ============ view: reports ============ */
function reportData(kind){
  const t=state.tickets, now=today();
  const inRange=(d,days)=>{ const x=parseDate(d); return x && daysBetween(x,now)>=0 && daysBetween(x,now)<days; };
  if(kind==='daily'){
    const raised=t.filter(x=>x._d.created&&daysBetween(x._d.created,now)===0);
    const resolved=t.filter(x=>x._d.end&&daysBetween(x._d.end,now)===0);
    const pending=t.filter(x=>!x._d.closed);
    const fu=pending.filter(x=>x._d.fuDue);
    return {title:'Daily ticket report',sub:fmt(now),blocks:[
      {h:'Tickets raised today',list:raised},{h:'Tickets resolved today',list:resolved},
      {h:'Follow-ups due',list:fu},{h:'All pending tickets',list:pending}]};
  }
  if(kind==='weekly'){
    const raised=t.filter(x=>inRange(x.createdDate,7));
    const resolved=t.filter(x=>x._d.end&&daysBetween(x._d.end,now)<7&&daysBetween(x._d.end,now)>=0);
    const pending=t.filter(x=>!x._d.closed);
    return {title:'Weekly ticket report',sub:fmt(addDays(now,-6))+' – '+fmt(now),blocks:[
      {h:'Raised this week',list:raised},{h:'Resolved this week',list:resolved},
      {h:'Overdue',list:pending.filter(x=>x._d.sla==='Overdue')},{h:'Pending',list:pending}],platform:true,delay:true};
  }
  const raised=t.filter(x=>inRange(x.createdDate,30));
  const resolved=t.filter(x=>x._d.end&&daysBetween(x._d.end,now)<30&&daysBetween(x._d.end,now)>=0);
  return {title:'Monthly management report',sub:fmt(addDays(now,-29))+' – '+fmt(now),blocks:[
    {h:'Raised in period',list:raised},{h:'Resolved in period',list:resolved},
    {h:'Overdue now',list:t.filter(x=>!x._d.closed&&x._d.sla==='Overdue')}],platform:true,delay:true,category:true};
}

/* ============ view: import ============ */
let importRows=null, importMap={};
const IMPORT_FIELDS=[['ticketId','Ticket ID'],['createdDate','Creation Date'],['endDate','End Date'],['platform','Platform (Amz/FK/DF)'],['description','Issue → Issue Description'],['statusText','What Updates → Current Status'],['remarks','Remarks'],['category','Issue Category'],['priority','Priority'],['assignedTo','Assigned To'],['raisedBy','Raised By'],['orderId','Reference Order ID'],['sku','SKU / ASIN / FSN'],['sno','S.No (ignored)']];
function guessMap(headers){
  const m={}; const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  headers.forEach(h=>{
    const n=norm(h);
    if(/^sno|^srno|^serial/.test(n)) m[h]='sno';
    else if(n.includes('ticketid')||n==='ticket') m[h]='ticketId';
    else if(n.includes('creation')||n==='date'||n.includes('createdate')||n.includes('createddate')) m[h]='createdDate';
    else if(n.includes('enddate')||n.includes('closeddate')||n.includes('resolutiondate')) m[h]='endDate';
    else if(n.includes('platform')||n.includes('amz')||n.includes('marketplace')) m[h]='platform';
    else if(n.includes('whatupdate')||n.includes('update')||n.includes('status')) m[h]='statusText';
    else if(n.includes('issue')||n.includes('problem')||n.includes('description')) m[h]='description';
    else if(n.includes('remark')||n.includes('comment')) m[h]='remarks';
    else if(n.includes('categor')) m[h]='category';
    else if(n.includes('priorit')) m[h]='priority';
    else if(n.includes('assign')||n.includes('owner')) m[h]='assignedTo';
    else if(n.includes('raisedby')||n.includes('createdby')) m[h]='raisedBy';
    else if(n.includes('order')) m[h]='orderId';
    else if(n.includes('sku')||n.includes('asin')||n.includes('fsn')) m[h]='sku';
    else m[h]='';
  });
  return m;
}
function normPlatform(v){
  const s=String(v||'').toLowerCase();
  if(!s) return '';
  if(s.includes('amz')||s.includes('amazon')) return 'Amazon';
  if(s.includes('fk')||s.includes('flip')) return 'Flipkart';
  if(s.includes('df')||s.includes('direct')) return 'Direct Fulfillment';
  return '';
}
function normStatus(v){
  const s=String(v||'').toLowerCase().trim();
  if(!s) return {status:'',note:''};
  const has=(...w)=>w.some(x=>s.includes(x));
  let st='';
  if(has('closed')) st='Closed';
  else if(has('resolved','solved','credited','refunded','completed','done','settled')) st='Resolved';
  else if(has('escalat')) st='Escalated';
  else if(has('follow')) st='Follow-up Required';
  else if(has('waiting for our','our action','pending from us','need to','we have to','internal')) st='Waiting for Our Action';
  else if(has('waiting','awaited','no reply','pending from amazon','pending from flipkart','reply awaited','under review','with amazon','with flipkart')) st='Waiting for Platform Reply';
  else if(has('in progress','working','wip','processing')) st='Work in Progress';
  else if(has('new','raised')) st='New';
  return {status:st,note:String(v).trim()};
}

function readTicketForm(existing){
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
  const req=['f_platform','f_ticketId','f_desc','f_created'];
  let bad=false;
  req.forEach(id=>{ const el=document.getElementById(id); if(!el) return;
    const f=el.closest('.field'); const msg=f?f.querySelector('.errmsg'):null;
    if(!el.value.trim()){ bad=true; if(f)f.classList.add('err'); if(msg)msg.hidden=false; }
    else { if(f)f.classList.remove('err'); if(msg)msg.hidden=true; }
  });
  if(bad) return null;
  const end=g('f_end');
  const t=Object.assign({
    id:existing?existing.id:uid('t_'), source:existing?existing.source:'manual',
    activities:existing?(existing.activities||[]):[], followups:existing?(existing.followups||0):0, escalations:existing?(existing.escalations||0):0
  }, existing||{});
  Object.assign(t,{
    platform:g('f_platform'), ticketId:g('f_ticketId'), category:g('f_category'), priority:g('f_priority'),
    description:g('f_desc'), createdDate:g('f_created'), targetDate:g('f_target'),
    raisedBy:g('f_raised'), assignedTo:g('f_assigned'), department:g('f_dept'),
    status:g('f_status'), nextFollowupDate:g('f_followup'),
    endDate:end, actualResolutionDate:end,
    ticketLink:g('f_link'), orderId:g('f_order'), sku:g('f_sku'), attachments:g('f_attach'),
    remarks:g('f_remarks'), internalNotes:g('f_notes')
  });
  if(document.getElementById('f_delayReason')){
    Object.assign(t,{delayReason:g('f_delayReason'),delayOwner:g('f_delayOwner'),lastReplyFrom:g('f_replyFrom'),
      lastReplyDate:g('f_replyDate'),ourLastResponseDate:g('f_ourResp'),platformLastResponseDate:g('f_platResp'),
      followups:+g('f_followups')||0,escalations:+g('f_escalations')||0});
  }
  if(end && !DONE.includes(t.status)) t.status='Resolved';
  if(!end && t.status==='Resolved') { t.status='Work in Progress'; }
  if(!existing){
    t.lastActionBy=t.raisedBy; t.lastActionDate=t.createdDate; t.department=t.department||'E-Commerce Operations';
    t.activities=[{id:uid('a_'),date:t.createdDate,time:String(new Date().getHours()).padStart(2,'0')+':'+String(new Date().getMinutes()).padStart(2,'0'),
      by:t.raisedBy,type:'Ticket Raised',desc:t.description+(t.remarks?' — '+t.remarks:''),replyFrom:'Our Team',next:'',nextDate:t.nextFollowupDate||'',attach:t.attachments||''}];
  }
  return t;
}

const TICKET_COLS=[['ticketId','Ticket ID'],['platform','Platform'],['category','Issue Category'],['description','Issue Description'],
  ['status','Current Status'],['waiting','Waiting With'],['priority','Priority'],['assignedTo','Assigned To'],['department','Department'],
  ['raisedBy','Raised By'],['createdDate','Creation Date'],['targetDate','Target Resolution Date'],['endDate','End Date'],
  ['age','Ticket Age (days)'],['daysOpen','Days Open'],['sla','SLA Status'],['delayDays','Delay Days'],
  ['delayReason','Delay Reason'],['delayOwner','Delay Owner'],['lastActionBy','Last Action By'],['lastActionDate','Last Action Date'],
  ['noUpdateDays','Days Since Update'],['nextFollowupDate','Next Follow-up Date'],['lastReplyFrom','Last Reply From'],['lastReplyDate','Last Reply Date'],
  ['ourLastResponseDate','Our Last Response'],['platformLastResponseDate','Platform Last Response'],['followups','Follow-ups'],['escalations','Escalations'],
  ['orderId','Reference Order ID'],['sku','SKU / ASIN / FSN'],['ticketLink','Ticket Link'],['remarks','Remarks'],['internalNotes','Internal Notes'],['attachments','Attachments']];
function ticketRow(t){
  const d=t._d, o={};
  TICKET_COLS.forEach(([k,label])=>{
    let v;
    if(k in d && !(k in t)) v=d[k];
    else v=t[k];
    if(k==='waiting') v=d.waiting; if(k==='sla') v=d.sla; if(k==='age') v=d.age; if(k==='daysOpen') v=d.closed?'':d.daysOpen;
    if(k==='delayDays') v=d.delayDays; if(k==='noUpdateDays') v=d.closed?'':d.noUpdateDays;
    if(k==='targetDate') v=t.targetDate?fmt(t.targetDate):(d.target?fmt(d.target):'');
    else if(/Date$/.test(k)) v=v?fmt(v):'';
    o[label]=v==null?'':v;
  });
  return o;
}
function toCSV(rows){
  if(!rows.length) return '';
  const heads=Object.keys(rows[0]);
  const q=v=>{ const s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  return heads.join(',')+'\n'+rows.map(r=>heads.map(h=>q(r[h])).join(',')).join('\n');
}
async function offerFile(filename,data){
  if(DLX){
    try{ await DLX.save({filename,data}); toast('Saved '+filename); return; }
    catch(e){ if(e&&e.code==='declined') return; toast('Download not available here ('+(e&&e.code||'error')+').'); }
  }
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:'text/plain'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('Download started: '+filename);
  }catch(e){ toast('Could not create the file here.'); }
}

let deferredRender=false;
function render(opts){
  const bg=opts&&opts.background;
  /* a background refresh (a teammate's change) never interrupts typing or an open form */
  if(bg){
    const a=document.activeElement;
    if(a && a.closest && a.closest('#view') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){ deferredRender=true; renderNav(); return; }
  }
  deferredRender=false;
  recompute();
  const map={dashboard:viewDashboard,tickets:viewTickets,action:viewAction,delay:viewDelay,ageing:viewAgeing,
    activity:viewActivity,reports:viewReports,management:viewManagement,import:viewImport,settings:viewSettings};
  const y=window.scrollY;
  $('#view').innerHTML=(map[state.view]||viewDashboard)();
  renderNav();
  if(bg){ window.scrollTo(0,y); return; }
  renderOverlay();
  window.scrollTo({top:0,behavior:'instant'});
}
